          type: array
          items:
            type: string
            enum: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        windows:
          type: array
          items:
            $ref: "#/components/schemas/InspectionWindow"
        maxBookingsPerWindow:
          type: integer
          description: Minimum 1; invalid values are sanitized server-side.
        blackoutDates:
          type: array
          items:
            type: string
            description: YYYY-MM-DD dates; invalid entries are ignored server-side.
