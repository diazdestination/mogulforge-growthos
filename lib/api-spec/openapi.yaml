          type: string
          enum: [company, service, service_area, hours, faq, financing, warranty, policy, escalation, disclaimer, brand_voice]
        title:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
        isActive:
          type: boolean
    KnowledgeEntryPatch:
      type: object
      properties:
        category:
          type: string
          enum: [company, service, service_area, hours, faq, financing, warranty, policy, escalation, disclaimer, brand_voice]
        title:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
        isActive:
          type: boolean
