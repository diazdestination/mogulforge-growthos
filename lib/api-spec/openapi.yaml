        category:
          type: string
          enum: [company, service, service_area, hours, faq, financing, warranty, policy, escalation, disclaimer, brand_voice]
        title:
          type: string
        content:
          type: string
        source:
          type: string
          description: Where this fact came from ("manual", "seed").
        isActive:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
    KnowledgeEntryInput:
      type: object
