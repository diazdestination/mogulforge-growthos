            - $ref: "#/components/schemas/InspectionAvailabilitySettings"
            - type: "null"
        appointmentReminder:
          oneOf:
            - $ref: "#/components/schemas/AppointmentReminderSettings"
            - type: "null"
        aiInstructions:
          type: [string, "null"]
          description: Extra org-specific instructions appended to AI prompts.
        securityAlertsAcknowledgedAt:
          type: [string, "null"]
          description: ISO timestamp; brute-force security alerts recorded at or before this instant are dismissed.
        fallbackNotificationInbox:
          type: [string, "null"]
          description: Fallback email address for portal message notifications when the assigned rep has no valid email.
        customerEmailSenderUserId:
          type: [string, "null"]
          description: Active company staff member whose connected Gmail sends unassigned customer email and portal sign-in codes.
        googleReviews:
          oneOf:
            - $ref: "#/components/schemas/GoogleReviewsConfig"
            - type: "null"
        widget:
          oneOf:
            - $ref: "#/components/schemas/WidgetSettings"
            - type: "null"
        concierge:
          oneOf:
            - $ref: "#/components/schemas/ConciergeSettings"
            - type: "null"
        sendingHours:
          oneOf:
            - $ref: "#/components/schemas/SendingHoursSettings"
            - type: "null"
        playbookStageBehaviors:
          oneOf:
            - $ref: "#/components/schemas/PlaybookStageBehaviors"
            - type: "null"
        updatedAt:
          type: string
    OrgSettingsInput:
      type: object
      properties:
        businessProfile:
          $ref: "#/components/schemas/BusinessProfile"
        services:
          type: array
          items:
            $ref: "#/components/schemas/ServiceEntry"
        serviceAreas:
          type: array
          items:
            $ref: "#/components/schemas/ServiceAreaEntry"
        leadScoring:
          $ref: "#/components/schemas/LeadScoringSettings"
        inspectionAvailability:
          $ref: "#/components/schemas/InspectionAvailabilitySettings"
        appointmentReminder:
          $ref: "#/components/schemas/AppointmentReminderSettings"
        aiInstructions:
          type: string
          maxLength: 4000
        securityAlertsAcknowledgedAt:
          type: string
          description: ISO timestamp; acknowledges (dismisses) brute-force security alerts recorded at or before this instant.
        fallbackNotificationInbox:
          type: string
          nullable: true
          description: Fallback email address for portal message notifications when the assigned rep has no valid email.
        customerEmailSenderUserId:
          type: [string, "null"]
          minLength: 1
          maxLength: 255
          description: Explicit company default Gmail sender; null removes it. Must be an active company member authorized to send and connected with gmail.send.
        googleReviews:
          $ref: "#/components/schemas/GoogleReviewsConfig"
        widget:
          $ref: "#/components/schemas/WidgetSettings"
        concierge:
          $ref: "#/components/schemas/ConciergeSettings"
        sendingHours:
          $ref: "#/components/schemas/SendingHoursSettings"
        playbookStageBehaviors:
          $ref: "#/components/schemas/PlaybookStageBehaviors"
    PlaybookStageBehaviors:
      type: object
      description: Lead pipeline stage → what happens to the lead's live acquisition playbook enrollment when it enters that stage. Missing stages use the built-in defaults (outreach stages continue; everything else completes).
      additionalProperties:
        $ref: "#/components/schemas/StageBehavior"
    StageBehavior:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [continue, pause, complete, cancel, enroll]
        enrollPlaybookId:
          type: [string, "null"]
          description: Target playbook to hand the lead to (only for action "enroll").
    SendingHoursSettings:
      type: object
      description: Quiet hours and frequency caps for automated outreach (playbooks + automation email/SMS). Quiet hours defer sends into the next allowed window; they never drop them.
      required: [quietHoursEnabled, timezone, startHour, endHour, days, maxTouchesPerDay]
      properties:
        quietHoursEnabled:
          type: boolean
          description: Master switch. Off means historical behavior (send any time).
        timezone:
          type: string
          description: IANA timezone the sending window is evaluated in.
        startHour:
          type: integer
          description: Inclusive start hour (0-23) of the allowed sending window.
        endHour:
          type: integer
          description: Exclusive end hour (1-24) of the allowed sending window.
        days:
          type: array
          items:
            type: string
          description: Days sends are allowed (Mon..Sun).
        maxTouchesPerDay:
          type: integer
          description: Max automated touches per contact per rolling 24h (0 = unlimited).
    WidgetSettings:
      type: object
      description: Embeddable website widget (closer.js) modules & appearance. All values are public.
      required: [leadCaptureEnabled]
      properties:
        leadCaptureEnabled:
          type: boolean
          description: Master switch for the lead-capture launcher module.
        primaryColor:
          type: string
          description: CSS color for the launcher & accents.
        position:
          type: string
          enum: [left, right]
          description: Corner the launcher docks to.
        greeting:
          type: string
          description: Greeting shown at the top of the open panel.
        buttonLabel:
          type: string
          description: Label on the launcher button.
        testMode:
          type: boolean
          description: When true the widget is hidden from normal visitors and only renders for pages loaded with the mf_preview=1 flag.
        conciergeEnabled:
          type: boolean
          description: AI concierge chat module (uses the org knowledge base + intake flow).
    ConciergeIntent:
      type: object
      description: One selectable concierge intent. Array order controls keyword-match priority and quick-reply order.
      required: [key, label, service, points, reason, urgency, triage, keywords]
      properties:
        key:
          type: string
          description: Stable key stored on conversations/leads (e.g. "leak").
        label:
          type: string
          description: Quick-reply label shown to visitors.
        service:
          type: string
          description: CRM service slug recommended for this intent.
        points:
          type: number
          description: Base lead-score points (0-100, clamped server-side).
        reason:
          type: string
          description: Score-reason text shown to reps.
        urgency:
          type: string
          enum: [normal, high, emergency]
        triage:
          type: boolean
          description: Whether this intent runs the emergency triage question first.
        keywords:
          type: array
          items:
            type: string
          description: Case-insensitive substrings that detect this intent in free text.
    ConciergeSettings:
      type: object
      description: Org-configurable AI concierge behavior. Defaults preserve the original roofing behavior.
      properties:
        assistantName:
          type: string
        greeting:
          type: string
        intents:
          type: array
          items:
            $ref: "#/components/schemas/ConciergeIntent"
        intakeDisclaimer:
          type: string
          description: Guardrail line sent when pricing/insurance/safety conclusions are asked.
        emergencySafety:
          type: string
        emergencyEscalation:
          type: string
        unknownAnswerFallback:
          type: string
          description: Reply when a visitor asks something the knowledge base cannot answer.
        wrapUpNote:
          type: string
    KnowledgeEntry:
      type: object
      description: One org knowledge-base fact grounding concierge answers and outreach drafting.
      required: [id, category, title, content, source, isActive, createdAt, updatedAt]
      properties:
        id:
