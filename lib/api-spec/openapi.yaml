          type: string
          enum: [pending, success, failed]
        attempts:
          type: integer
        signatureVersion:
          type: string
          description: Signing scheme version used for this delivery (e.g. "v1").
        responseStatus:
          type: integer
          nullable: true
        lastError:
          type: string
          nullable: true
        deliveredAt:
          type: string
          nullable: true
        createdAt:
          type: string
