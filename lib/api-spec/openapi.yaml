  /v1/webhooks/{id}/rotate-secret:
    post:
      operationId: rotateWebhookSecret
      tags: [webhooks]
      summary: Rotate a webhook endpoint's signing secret
      description: >-
        Issues a fresh signing secret, returned only in this response.
        During the optional grace period, deliveries carry `v1=` signature
        entries for both the new and the old secret so receivers can switch
        without dropping deliveries; afterwards only the new secret is used.
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateWebhookSecretInput"
      responses:
        "200":
          description: Endpoint with its new one-time signing secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointWithSecret"
        "400":
          description: Invalid rotation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/webhooks/{id}/previous-secret:
    delete:
      operationId: expireWebhookPreviousSecret
      tags: [webhooks]
      summary: End a secret rotation grace window early
      description: >-
        Immediately stops honoring the old signing secret from the most
        recent rotation. No-op semantics — returns the endpoint even when no
        grace window is active.
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: Endpoint with the grace window ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
