openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: MogulForge GrowthOS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: me
    description: Current user context
  - name: contacts
  - name: properties
  - name: leads
  - name: tasks
  - name: appointments
  - name: activities
  - name: users
  - name: public
    description: Public (unauthenticated) endpoints
  - name: portal
    description: Homeowner portal (OTP-verified homeowner sessions)
  - name: conversations
    description: AI Concierge conversations
  - name: analytics
  - name: audit
  - name: dashboard
  - name: settings
  - name: templates
  - name: automations
  - name: playbooks
  - name: reactivation
  - name: webhooks
  - name: tags
  - name: api-keys
    description: Org-scoped API key management
  - name: estimates
    description: Job estimates linked to leads
  - name: projects
    description: Production projects for won jobs
  - name: assistant
    description: CRM AI assistant
paths:
  /v1/smart-sites/leads/{id}/follow-up:
    get:
      operationId: getSmartSiteInquiryOwnership
      tags: [leads]
      summary: Read ownership of one exact website inquiry
      description: Company-scoped crm.read with no-store. Independent of the bounded Capture queue. canClaim requires an accepted verified active responder session, current crm.write authority, an open inquiry and no owner. API-key readers cannot claim. No contact details or message content are returned.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Current inquiry ownership; re-read after an uncertain or conflicting claim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmartSiteInquiryOwnership'
        '400':
          description: Invalid ID or unexpected query fields.
        '401':
          description: Authentication required.
        '403':
          description: Current company read access denied.
        '404':
          description: Ordinary lead or inquiry unavailable in this company.
        '503':
          description: Unavailable; do not infer current ownership.
