          description: Local start hour, 0-23. Out-of-range values are sanitized server-side.
        endHour:
          type: integer
          description: Local end hour, 1-24 (must be greater than startHour). Sanitized server-side.
    InspectionAvailabilitySettings:
      type: object
      required: [timezone, days, windows, maxBookingsPerWindow, blackoutDates]
      properties:
        timezone:
          type: string
          description: IANA timezone the windows are expressed in.
