      operationId: createClientStaffInvitation
      tags: [onboarding]
      summary: Invite a staff member using an immutable request ID
      description: Platform administrator session required. Repeat the identical request ID after an unknown result; changing its contents returns a conflict. An unconfirmed delivery requires explicit review.
      parameters:
        - { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
