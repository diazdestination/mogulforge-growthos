# fly.toml app configuration file generated for mogulforge-growthos on 2026-08-13T22:36:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mogulforge-growthos'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = "node /app/scripts/release-schema.mjs"

[env]
  APP_ORIGIN = 'https://app.mogulforge.ai'
  NODE_ENV = 'production'
  OBJECT_STORAGE_PROVIDER = 'postgres'
  PORT = '3001'
  STATIC_DIR = '/app/public'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
