# fly.toml app configuration file generated for mogulforge-growthos on 2026-08-13T22:36:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mogulforge-growthos'
primary_region = 'iad'
kill_signal = 'SIGTERM'
kill_timeout = 30

[build]
  dockerfile = 'Dockerfile'

# The beta schema is provisioned separately on the confirmed fresh database.
# The retired release-schema.mjs deliberately refuses automatic reconciliation.
# Check current columns without altering schema or data before admitting deploy.
[deploy]
  release_command = "pnpm --filter @workspace/scripts exec tsx /app/scripts/beta-schema-preflight.mjs"

[env]
  APP_ORIGIN = 'https://app.mogulforge.ai'
  NODE_ENV = 'production'
  OBJECT_STORAGE_PROVIDER = 'postgres'
  PORT = '3001'
  STATIC_DIR = '/app/public'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep one scheduler alive in iad even when no browser is open.
  # Prepared configuration only; applying it requires approved deployment/cost.
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
