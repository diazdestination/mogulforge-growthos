# Isolated GrowthOS staging configuration.
# This file intentionally names a different Fly app and origin than production.
# Provision the app and its dedicated logical database before the first deploy.

app = 'mogulforge-growthos-staging'
primary_region = 'iad'
kill_signal = 'SIGTERM'
kill_timeout = 30

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = "node /app/scripts/release-schema.mjs"

[env]
  APP_ORIGIN = 'https://mogulforge-growthos-staging.fly.dev'
  NODE_ENV = 'production'
  OBJECT_STORAGE_PROVIDER = 'postgres'
  PORT = '3001'
  # Fail closed until staging data and provider credentials pass preflight.
  SCHEDULER_AUTOSTART = 'false'
  STATIC_DIR = '/app/public'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Reserve the always-on topology; background work is held above for preflight.
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
