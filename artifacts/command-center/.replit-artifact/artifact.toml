kind = "web"
previewPath = "/crm/"
title = "MogulForge GrowthOS"
description = "AI-powered home-services CRM: sign-in, leads pipeline, contacts, properties, tasks, appointments, homeowner communication, automation, and revenue intelligence."
version = "1.0.0"
id = "artifacts/command-center"
router = "path"

[[services]]
name = "web"
paths = [ "/crm/" ]
localPort = 23748

[services.development]
run = "pnpm --filter @workspace/command-center run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/command-center", "run", "build" ]
serve = "static"
publicDir = "artifacts/command-center/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23748"
BASE_PATH = "/crm/"
